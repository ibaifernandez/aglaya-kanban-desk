name: docs-guard

# Impide que vuelva a entrar estado copiado en las puertas de entrada del repo
# (README.md, CLAUDE.md): versiones tecleadas, conteos de tests, y fase/backlog
# duplicados de docs/ROADMAP.md y docs/BACKLOG.md.
#
# Doctrina (2026-07-21, auditoría del orquestador de flota): un documento puede
# describir diseño y decisiones; no puede describir estado. Si hace falta estado,
# se consulta a su custodio.
#
# Los tres pasos NO son redundantes:
#   1. guard      — ¿hay estado copiado en los ficheros vigilados?
#   2. sello      — ¿el guardián muerde en cada forma que dice vigilar?
#   3. mutación   — ¿el sello lo nota si alguien destripa una regla?
# Sin (2), un guardián con un regex roto da verde y además tranquiliza.
# Sin (3), el sello puede ser decoración.
#
# Ámbito y exclusiones deliberadas (CHANGELOG, docs/legal, ROADMAP, BACKLOG,
# audits): ver la cabecera de scripts/docs-guard.sh.
#
# Corre en push Y pull_request a main (el repo despliega por push directo a main).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Una rama que recibe tres empujones seguidos pagaba tres corridas enteras, y las
# dos primeras ya no le importaban a nadie. Se agrupa por workflow + rama y se
# cancela la que quede obsoleta.
#
# `cancel-in-progress` solo en pull_request A PROPÓSITO: en `main` la corrida ES
# el registro de que lo que hay puesto pasó sus comprobaciones. Cancelarla deja
# un `main` sin ese registro y ahorrando calderilla.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Docs sin estado copiado
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (historial completo para el diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # El guardián arranca SIEMPRE — la casilla queda puesta en el PR — y lo
      # primero que hace es preguntarse si hay algo que mirar. Quién decide eso
      # es él, no este fichero: si la lista viviera aquí sería una SEGUNDA lista,
      # y ya sabemos cómo acaban. Ver la cabecera de scripts/docs-guard.sh.
      - name: ¿Tiene algo que mirar este cambio?
        id: relevancia
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          CAMBIOS="$(git diff --name-status "$BASE" "$HEAD")"
          echo "Ficheros cambiados:"; echo "$CAMBIOS"; echo "---"

          VEREDICTO="$(DOCS_GUARD_CAMBIADOS="$CAMBIOS" bash scripts/docs-guard.sh --relevante)"
          echo "correr=$VEREDICTO" >> "$GITHUB_OUTPUT"

      - name: Sello — ¿el guardián muerde en cada forma vigilada?
        if: steps.relevancia.outputs.correr == 'SI'
        run: bash scripts/docs-guard.test.sh

      - name: Mutación — ¿el sello nota si se destripa una regla?
        if: steps.relevancia.outputs.correr == 'SI'
        run: bash scripts/docs-guard.mutation.sh

      - name: Guardián — ¿hay estado copiado en README.md / CLAUDE.md?
        if: steps.relevancia.outputs.correr == 'SI'
        run: bash scripts/docs-guard.sh
