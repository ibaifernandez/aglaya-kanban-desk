name: Digest horario

# CADENCIA: se queda EN CADA HORA, y no es un descuido. Medido el 6-ago-2026.
#
# Es el cron más caro de la casa —24 corridas al día, ~744 al mes, y GitHub
# factura un minuto mínimo por trabajo aunque el `curl` tarde ocho segundos—.
# Aun así no se baja, y conviene saber por qué antes de bajarlo:
#
# **La hora la elige cada usuario.** `users.digest_hour` (0-23 UTC) decide a
# quién le toca en cada pasada; el servidor filtra. Correr menos veces no manda
# menos correo: manda CERO correo a quien tenga configurada una hora que ya no
# se visita. Y no falla — nadie recibe un error, simplemente deja de llegarle.
# Es la forma exacta que esta nave persigue: no rompe, desaparece.
#
# Cuáles son las horas realmente en uso NO se puede leer desde aquí, y hace
# falta para decidir. Una consulta lo contesta:
#
#   SELECT digest_hour, count(*) FROM public.users
#    WHERE digest_enabled GROUP BY 1 ORDER BY 1;
#
# Si todas caen en una sola hora, este cron puede ser esa hora y nada más.
#
# LO QUE DE VERDAD LO ARREGLA, y no es la cadencia: esto es un despertador que
# le da un toque a un servidor que YA ESTÁ ENCENDIDO. Railway corre el proceso
# de Express las 24 horas; programar ahí dentro el aviso horario cuesta cero
# minutos de Actions en vez de 744 al mes, y encima deja de depender de que un
# runner ajeno esté disponible a las en punto. Eso es cambio de servidor, no de
# workflow, y por eso no entra en este PR.

on:
  schedule:
    # Cada hora UTC en punto. El server filtra qué usuarios reciben digest
    # según su preferencia `users.digest_hour` (0-23 UTC).
    - cron: '0 * * * *'
  workflow_dispatch: # permite lanzarlo manualmente desde GitHub UI

# Sin cancelación: aquí no hay corrida obsoleta que tirar — hay una tarea que o
# se hace o no se hace. El grupo solo evita que dos se pisen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar digest en Railway
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_SERVER_URL }}/api/digest/cron-trigger" \
            -H "x-cron-secret: ${{ secrets.DIGEST_CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response: $(cat /tmp/response.json)"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ El servidor respondió con código $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Digest iniciado correctamente"
