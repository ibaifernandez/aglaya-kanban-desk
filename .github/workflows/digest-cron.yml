name: Digest horario

# CADENCIA: solo las horas de `server/constants/digest-hours.js`.
#
# ⚠️ ESTAS HORAS NO SE TOCAN AQUÍ. La lista canónica vive en
# `server/constants/digest-hours.js`, y `scripts/digest-horas-guard.sh` se pone
# ROJO si este `cron` y esa lista dejan de decir lo mismo. Cambiar una sin la
# otra es exactamente lo que este montaje existe para impedir.
#
# POR QUÉ, Y QUÉ COSTÓ AVERIGUARLO. Este fichero corrió `0 * * * *` —24 pasadas
# diarias— durante meses, y su cabecera declaraba por qué no se podía bajar: la
# hora la elige cada usuario, así que **correr menos veces no manda menos correo,
# manda CERO correo a quien tenga una hora que ya no se visita**. Y no falla:
# nadie recibe un error, simplemente deja de llegarle.
#
# El dato que faltaba lo ejecutó Ibai el 11-ago-2026 y está pegado dentro de la
# tarjeta `a1015f7c`: **un solo usuario con el digest activo, hora 11 UTC**. 23 de
# las 24 pasadas no tenían a quién escribir.
#
# Y NO SE BAJÓ SOLO CLAVANDO LA HORA, porque eso habría dejado la trampa intacta
# para el siguiente cambio de preferencia. Ahora el servidor **rechaza** guardar
# una hora que este reloj no visita: la lista es una y los dos la leen. Sin esa
# mitad, esto no sería un ahorro sino un modo de fallo silencioso más barato.

on:
  schedule:
    # Derivado de DIGEST_HOURS en server/constants/digest-hours.js. Vigilado por
    # scripts/digest-horas-guard.sh — si esto y la lista divergen, CI se pone rojo.
    - cron: '0 11 * * *'
  workflow_dispatch: # permite lanzarlo manualmente desde GitHub UI

# Sin cancelación: aquí no hay corrida obsoleta que tirar — hay una tarea que o
# se hace o no se hace. El grupo solo evita que dos se pisen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar digest en Railway
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_SERVER_URL }}/api/digest/cron-trigger" \
            -H "x-cron-secret: ${{ secrets.DIGEST_CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response: $(cat /tmp/response.json)"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ El servidor respondió con código $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Digest iniciado correctamente"
