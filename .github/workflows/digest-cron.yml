name: Digest horario

on:
  schedule:
    # Cada hora UTC en punto. El server filtra qué usuarios reciben digest
    # según su preferencia `users.digest_hour` (0-23 UTC).
    - cron: '0 * * * *'
  workflow_dispatch: # permite lanzarlo manualmente desde GitHub UI

jobs:
  trigger-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar digest en Railway
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ secrets.RAILWAY_SERVER_URL }}/api/digest/cron-trigger" \
            -H "x-cron-secret: ${{ secrets.DIGEST_CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $HTTP_STATUS"
          echo "Response: $(cat /tmp/response.json)"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ El servidor respondió con código $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Digest iniciado correctamente"
