name: schema-guard

# Vacuna B-10 (audit Mariana): impide que una migración SQL entre sin actualizar
# el schema fuente de verdad (docs/schema/supabase-schema.sql) y, si crea tabla,
# sin GRANT explícito + ENABLE ROW LEVEL SECURITY.
#
# Causa raíz que previene (DOC-01, 2026-07-12): el schema doc llevaba fósil desde
# ~v1.2.0 porque las migraciones no lo actualizaban. Este guard rompe ese ciclo.
#
# Corre en push Y pull_request a main (el repo despliega por push directo a main).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una rama que recibe tres empujones seguidos pagaba tres corridas enteras, y las
# dos primeras ya no le importaban a nadie. Se agrupa por workflow + rama y se
# cancela la que quede obsoleta.
#
# `cancel-in-progress` solo en pull_request A PROPÓSITO: en `main` la corrida ES
# el registro de que lo que hay puesto pasó sus comprobaciones.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Migración ↔ schema doc + GRANT/RLS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (historial completo para diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # El sello va ANTES: si el guardián está destripado se sabe aquí, sin
      # gastar un diff. Mismo orden que docs-guard, contract-guard, grants-guard
      # y hook-guard.
      # Arranca SIEMPRE —la casilla queda puesta en el PR— y lo primero que hace
      # es preguntarse si hay algo que mirar. Quién decide eso es el guardián,
      # no este fichero: si la lista viviera aquí sería una SEGUNDA lista.
      - name: ¿Tiene algo que mirar este cambio?
        id: relevancia
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          CAMBIOS="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Ficheros cambiados:"; echo "$CAMBIOS"; echo "---"

          VEREDICTO="$(SCHEMA_GUARD_CAMBIADOS="$CAMBIOS" bash scripts/schema-guard.sh --relevante)"
          echo "correr=$VEREDICTO" >> "$GITHUB_OUTPUT"

      - name: Sello — ¿distingue estructura de datos, y sigue exigiendo GRANT/RLS?
        if: steps.relevancia.outputs.correr == 'SI'
        run: bash scripts/schema-guard.test.sh

      # La lógica vivía escrita a mano aquí dentro, así que no se podía sellar ni
      # correr en local: para saber si mordía había que empujar y mirar. Ahora es
      # un script como los demás guardianes de esta casa.
      - name: Guardián — sobre los ficheros de este cambio
        if: steps.relevancia.outputs.correr == 'SI'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Primer push a un branch nuevo: BASE all-zeros → comparar con árbol vacío
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          CAMBIADOS="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Ficheros cambiados:"; echo "$CAMBIADOS"; echo "---"

          SCHEMA_GUARD_CHANGED="$CAMBIADOS" bash scripts/schema-guard.sh
