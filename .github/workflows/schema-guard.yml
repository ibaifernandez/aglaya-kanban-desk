name: schema-guard

# Vacuna B-10 (audit Mariana): impide que una migración SQL entre sin actualizar
# el schema fuente de verdad (docs/schema/supabase-schema.sql) y, si crea tabla,
# sin GRANT explícito + ENABLE ROW LEVEL SECURITY.
#
# Causa raíz que previene (DOC-01, 2026-07-12): el schema doc llevaba fósil desde
# ~v1.2.0 porque las migraciones no lo actualizaban. Este guard rompe ese ciclo.
#
# Corre en push Y pull_request a main (el repo despliega por push directo a main).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una rama que recibe tres empujones seguidos pagaba tres corridas enteras, y las
# dos primeras ya no le importaban a nadie. Se agrupa por workflow + rama y se
# cancela la que quede obsoleta.
#
# `cancel-in-progress` solo en pull_request A PROPÓSITO: en `main` la corrida ES
# el registro de que lo que hay puesto pasó sus comprobaciones. Cancelarla deja
# un `main` sin ese registro y ahorrando calderilla.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Migración ↔ schema doc + GRANT/RLS
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (historial completo para diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Arranca siempre y decide dentro, igual que docs-guard y rail-scope: un
      # guardián que no se dispara no aparece en el PR, y una comprobación
      # ausente no se distingue de una que pasó.
      #
      # ⚠️ Aquí la lista SÍ está en el YAML, y es la única de las tres que lo
      # está. No es un descuido: hoy este guardián no tiene script — su lógica
      # vive escrita a mano dentro de este fichero. El PR #33 la saca a
      # `scripts/schema-guard.sh`; cuando entre, esta decisión se va con ella y
      # deja de haber lista en el workflow. Queda dicho para que no se quede.
      - name: ¿Tiene algo que mirar este cambio?
        id: relevancia
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          CAMBIOS="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Ficheros cambiados:"; echo "$CAMBIOS"; echo "---"

          if echo "$CAMBIOS" | grep -qE '^(migrations/|docs/schema/|\.github/workflows/schema-guard\.yml|scripts/schema-guard)'; then
            echo "relevante: cambió una migración, el documento del esquema o el propio guardián"
            echo "correr=SI" >> "$GITHUB_OUTPUT"
          else
            echo "nada que mirar: este cambio no toca migraciones ni el esquema"
            echo "correr=NO" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar coherencia migración ↔ schema
        if: steps.relevancia.outputs.correr == 'SI'
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Primer push a un branch nuevo: BASE all-zeros → comparar con árbol vacío
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          CHANGED="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Ficheros cambiados:"; echo "$CHANGED"; echo "---"

          MIGRATIONS="$(echo "$CHANGED" | grep -E '^(migrations/|docs/schema/migration-).*\.sql$' || true)"
          if [ -z "$MIGRATIONS" ]; then
            echo "Sin migraciones en el cambio — guard OK."
            exit 0
          fi
          echo "Migraciones detectadas:"; echo "$MIGRATIONS"; echo "---"

          # (1) toda migración exige actualizar el schema fuente de verdad
          if ! echo "$CHANGED" | grep -qx 'docs/schema/supabase-schema.sql'; then
            echo "::error::B-10: hay migración SQL pero NO se actualizó docs/schema/supabase-schema.sql (fuente de verdad). Regenera el schema y vuelve a commitear."
            exit 1
          fi

          # (2) migraciones que crean tabla exigen GRANT + ENABLE RLS
          FAIL=0
          for m in $MIGRATIONS; do
            git cat-file -e "$HEAD:$m" 2>/dev/null || continue
            CONTENT="$(git show "$HEAD:$m")"
            if echo "$CONTENT" | grep -qiE 'CREATE TABLE'; then
              echo "$CONTENT" | grep -qi 'GRANT'               || { echo "::error::B-10: $m crea tabla sin GRANT explícito."; FAIL=1; }
              echo "$CONTENT" | grep -qi 'ROW LEVEL SECURITY'  || { echo "::error::B-10: $m crea tabla sin ENABLE ROW LEVEL SECURITY."; FAIL=1; }
            fi
          done
          [ "$FAIL" = "0" ] || exit 1

          echo "B-10 guard: OK"
