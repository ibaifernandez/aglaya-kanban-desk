name: db-backup

# Mitigación de B-CRIT-02 (audit Mariana 2026-05-27):
#   Supabase plan = Free → sin daily backups ni PITR.
#   pg_dump diario a Cloudflare R2 (10 GB free, S3-compatible, sin egress fees).
#   Retención 30 días. Procedimiento de restore en docs/runbooks/db-restore.md.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily (off-peak Madrid/Santiago)
  workflow_dispatch:        # trigger manual desde Actions UI

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install postgresql-client-17
        run: |
          # Server is PG 17.6 (Supabase). Default Ubuntu 24.04 ships PG 16.
          # Add PostgreSQL official APT repo to get pg_dump 17.
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Prepend PG17 binaries to PATH for all subsequent steps
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Setup Python + boto3
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet boto3

      - name: pg_dump + upload to R2 via boto3
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          DUMP_FILE="kanban_${TS}.sql.gz"
          pg_dump "${DATABASE_URL}" \
            --no-owner --no-acl --clean --if-exists \
            | gzip -9 > "${DUMP_FILE}"
          ls -lh "${DUMP_FILE}"
          python3 <<PY
          import os, boto3
          from botocore.config import Config
          s3 = boto3.client('s3',
            endpoint_url=os.environ['R2_ENDPOINT'],
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
            region_name='auto',
            config=Config(signature_version='s3v4'),
          )
          s3.upload_file('${DUMP_FILE}', os.environ['R2_BUCKET'], '${DUMP_FILE}')
          print(f"Uploaded {os.environ['R2_BUCKET']}/${DUMP_FILE}")
          PY

      - name: Retention — keep last 30 days
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          python3 <<'PY'
          import os, boto3, datetime
          from botocore.config import Config
          s3 = boto3.client('s3',
            endpoint_url=os.environ['R2_ENDPOINT'],
            aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
            aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
            region_name='auto',
            config=Config(signature_version='s3v4'),
          )
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=30)
          paginator = s3.get_paginator('list_objects_v2')
          deleted = 0
          for page in paginator.paginate(Bucket=os.environ['R2_BUCKET']):
              for obj in page.get('Contents', []):
                  if obj['LastModified'] < cutoff:
                      print(f"Pruning {obj['Key']}")
                      s3.delete_object(Bucket=os.environ['R2_BUCKET'], Key=obj['Key'])
                      deleted += 1
          print(f"Pruned {deleted} object(s) older than 30 days")
          PY

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::DB backup failed — manual investigation required"
          # TODO: integrar Sentry/Slack webhook cuando exista observabilidad
