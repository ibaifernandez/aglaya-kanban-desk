name: db-backup

# Mitigación de B-CRIT-02 (audit Mariana 2026-05-27):
#   Supabase plan = Free → sin daily backups ni PITR.
#   pg_dump diario a Cloudflare R2 (10 GB free, S3-compatible, sin egress fees).
#   Retención 30 días. Procedimiento de restore en docs/runbooks/db-restore.md.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily (off-peak Madrid/Santiago)
  workflow_dispatch:        # trigger manual desde Actions UI

# Sin cancelación: aquí no hay corrida obsoleta que tirar — hay una tarea que o
# se hace o no se hace. El grupo solo evita que dos se pisen.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Declarado explícitamente: el permiso por defecto del token depende de la
    # configuración del repo, y un aviso que no puede escribir la incidencia
    # falla en silencio — que es el defecto que este paso viene a cerrar.
    permissions:
      contents: read
      issues: write
    steps:
      # ⚠️ ESTE `checkout` ES NUEVO (25-ago-2026) Y HACE FALTA. Este workflow no
      # lo tenía —no le hacía falta para volcar la base— y la verificación del
      # volcado vivía escrita dentro del YAML. Al sacarla a
      # `scripts/verificar-volcado.sh` para poder sellarla, el fichero tiene que
      # estar aquí. Sin esto, el paso muere con «No such file or directory».
      #
      # Cuesta un par de segundos dentro de un job que ya existe: ningún job
      # nuevo, ningún minuto nuevo.
      - name: Checkout (hace falta para scripts/verificar-volcado.sh)
        uses: actions/checkout@v4

      - name: Install postgresql-client-17
        run: |
          # Server is PG 17.6 (Supabase). Default Ubuntu 24.04 ships PG 16.
          # Add PostgreSQL official APT repo to get pg_dump 17.
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Prepend PG17 binaries to PATH for all subsequent steps
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: pg_dump
        env:
          CF_API_TOKEN:  ${{ secrets.R2_ACCESS_KEY_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET:     ${{ secrets.R2_BUCKET }}
          DATABASE_URL:  ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          DUMP_FILE="kanban_${TS}.sql.gz"
          pg_dump "${DATABASE_URL}" \
            --no-owner --no-acl --clean --if-exists \
            | gzip -9 > "${DUMP_FILE}"
          ls -lh "${DUMP_FILE}"
          echo "DUMP_FILE=${DUMP_FILE}" >> "$GITHUB_ENV"

      # Un volcado que sale VACÍO o a medias se sube igual de bien que uno bueno:
      # `pg_dump` puede terminar en 0 y escribir casi nada, y a partir de ahí lo
      # que hay en R2 es un fichero con nombre correcto y sin contenido. Nadie lo
      # nota hasta el día que hace falta restaurar, que es el único día en que
      # importa.
      #
      # No sustituye a una restauración de prueba — eso sigue sin hacerse nunca y
      # tiene su propia deuda. Es la comprobación más barata que separa «hay un
      # fichero» de «hay una copia».
      # La lógica vivía AQUÍ DENTRO, y por eso no se podía ejercitar ni mutar:
      # para saber si mordía había que empujar y mirar. Era el único guardián de
      # su día sin sello, y la factura llegó — abortó cuatro copias buenas
      # seguidas y no se supo hasta el cuarto día.
      #
      # Ahora es un script con su sello (`scripts/verificar-volcado.test.sh`), que
      # le da un volcado bueno de ~1 MB y exige verde. El fallo de entonces se
      # reproduce con eso; con un volcado de juguete, no.
      - name: Comprobar que el volcado tiene contenido, ANTES de subirlo
        run: bash scripts/verificar-volcado.sh "${DUMP_FILE}"

      - name: Subir a Cloudflare R2
        env:
          CF_API_TOKEN:  ${{ secrets.R2_ACCESS_KEY_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET:     ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          # Upload via R2 native API (NOT S3-compatible). Token type: cfut_/cfat_.
          HTTP_CODE=$(curl -sS -o /tmp/upload_resp.txt -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${DUMP_FILE}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects/${DUMP_FILE}")
          echo "HTTP $HTTP_CODE"
          cat /tmp/upload_resp.txt
          echo ""
          [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ] || exit 1

      - name: Retention — keep last 30 days
        env:
          CF_API_TOKEN:  ${{ secrets.R2_ACCESS_KEY_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          R2_BUCKET:     ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          # List + prune objects older than 30 days via R2 native API
          CUTOFF=$(date -u -d "30 days ago" +%s)
          NEXT_CURSOR=""
          deleted=0
          while true; do
            URL="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?per_page=1000"
            [ -n "$NEXT_CURSOR" ] && URL="${URL}&cursor=${NEXT_CURSOR}"
            RESP=$(curl -sS -H "Authorization: Bearer ${CF_API_TOKEN}" "$URL")
            echo "$RESP" | python3 -c "
          import json, sys, datetime
          d = json.load(sys.stdin)
          cutoff = $CUTOFF
          for o in d.get('result', []):
              # last_modified format: 2026-05-27T20:24:11.760Z
              ts = datetime.datetime.fromisoformat(o['last_modified'].replace('Z','+00:00')).timestamp()
              if ts < cutoff:
                  print(o['key'])
          " > /tmp/to_prune.txt
            while IFS= read -r KEY; do
              [ -z "$KEY" ] && continue
              echo "Pruning $KEY"
              curl -sS -X DELETE \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects/${KEY}" \
                >/dev/null
              deleted=$((deleted+1))
            done < /tmp/to_prune.txt
            NEXT_CURSOR=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('result_info',{}).get('cursor') or '')")
            [ -z "$NEXT_CURSOR" ] && break
          done
          echo "Pruned $deleted object(s) older than 30 days"

      # El aviso de fallo era un `::error::` en el log y un TODO. O sea que la
      # copia —la única red que hay bajo esta nave— fallaba de la forma exacta
      # contra la que se montó: la que nadie ve hasta que hace falta la copia.
      #
      # POR QUÉ UNA INCIDENCIA Y NO UN CORREO O UNA TARJETA. Medido: los secretos
      # de este repo son CF_ACCOUNT_ID, DATABASE_URL, DIGEST_CRON_SECRET,
      # R2_ACCESS_KEY_ID, R2_BUCKET y RAILWAY_SERVER_URL. **No hay TASK_SECRET ni
      # RESEND_API_KEY**, así que ni se puede clavar una tarjeta en el riel ni
      # mandar correo. `GITHUB_TOKEN` sí está siempre, y una incidencia es lo
      # único durable que se puede abrir sin pedir un secreto nuevo.
      #
      # Lo nativo de esta flota sería una tarjeta en el tablero. Para eso hace
      # falta añadir TASK_SECRET a los secretos del repo — que es un acto humano,
      # y queda dicho en la tarjeta en vez de simulado aquí.
      #
      # Se comenta en la incidencia abierta si ya existe, en vez de abrir una por
      # día: una racha de fallos tiene que leerse como UNA racha, no como veinte
      # avisos que se aprenden a ignorar.
      - name: Avisar del fallo, de forma que sobreviva al log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "::error::La copia de seguridad falló. Es la única red bajo esta nave."

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # El cuerpo se arma línea a línea a propósito. Escrito como una cadena
          # multilínea, sus líneas quedaban en la columna 0 dentro del bloque
          # literal de YAML — y eso CIERRA el bloque: el workflow entero deja de
          # parsearse. Cazado antes de empujarlo, pasando cada bloque `run:` por
          # `bash -n`. Un paso de aviso que rompe el fichero que lo contiene es
          # el fallo silencioso perfecto: se descubre el día del primer fallo.
          printf '%s\n' \
            "La copia de seguridad de la base de datos ha fallado." \
            "" \
            "**Corrida:** ${RUN_URL}" \
            "**Cuándo:** $(date -u '+%Y-%m-%d %H:%M UTC')" \
            "" \
            "Esta copia es la única red bajo esta nave: Supabase en plan gratuito no tiene" \
            "copias diarias ni recuperación a un punto en el tiempo. Mientras esto falle," \
            "**no hay copia de hoy**." \
            "" \
            "Qué mirar, en orden:" \
            "" \
            "1. El log de la corrida — el paso que falló lo dice." \
            "2. Si falló al **verificar el volcado**: la copia se abortó a propósito antes" \
            "   de subir un fichero vacío. El problema está en la base o en pg_dump, no en R2." \
            "3. Si falló al **subir**: mira el token de Cloudflare (R2_ACCESS_KEY_ID), que" \
            "   tiene fecha de caducidad. El procedimiento vive en docs/runbooks/key-rotation.md." \
            "" \
            "Cierra esta incidencia cuando haya una copia correcta. Si vuelve a fallar sin" \
            "cerrarla, se añade un comentario aquí en vez de abrir otra: una racha tiene que" \
            "leerse como UNA racha, no como veinte avisos que se aprenden a ignorar." \
            > /tmp/cuerpo.md

          # ⚠️ `--repo` EN TODAS, Y ESTE COMENTARIO ES EL MOTIVO. Faltaba, y por
          # eso este aviso —que existe para que el fallo de la copia deje de ser
          # silencioso— **murió en su primera línea durante cuatro fallos
          # seguidos, sin dejar ni una incidencia**.
          #
          # `gh` deduce el repositorio del remoto de git, y cuando esto se
          # arregló **no había repositorio**: este workflow no hacía
          # `actions/checkout`. La primera llamada moría con
          #
          #     failed to run git: fatal: not a git repository (…): .git
          #
          # y con `set -euo pipefail` el paso se acababa ahí — antes del comment y
          # antes del create. **No era permisos:** `GH_TOKEN` estaba puesto y
          # `issues: write` declarado.
          #
          # ⚠️ DESDE EL 25-ago-2026 SÍ HAY `checkout`, y `--repo` SE QUEDA. No es
          # redundancia: la bandera lleva un dato que ya está en el entorno, y el
          # `checkout` está aquí por otro motivo —traer
          # `scripts/verificar-volcado.sh`—. El día que esa verificación vuelva a
          # otro sitio, alguien quitará el `checkout` con toda la razón, y este
          # aviso NO puede depender de eso. Depender de él sería volver a romper
          # esto en silencio.
          REPO="${GITHUB_REPOSITORY}"

          ABIERTA=$(gh issue list --repo "$REPO" --state open --label copia-fallida --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$ABIERTA" ]; then
            echo "Ya hay una incidencia abierta (#${ABIERTA}); se añade el fallo de hoy."
            gh issue comment "$ABIERTA" --repo "$REPO" --body-file /tmp/cuerpo.md
          else
            gh label create copia-fallida --repo "$REPO" --description "La copia de seguridad diaria falló" --color B60205 2>/dev/null || true
            gh issue create \
              --repo "$REPO" \
              --title "La copia de seguridad de la base de datos ha fallado" \
              --label copia-fallida \
              --body-file /tmp/cuerpo.md
          fi
