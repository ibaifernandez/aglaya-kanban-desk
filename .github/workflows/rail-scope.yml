name: rail-scope

# El alcance del riel, vigilado en las DOS direcciones y POR RELOJ.
#
# POR QUÉ SALE DE ci.yml. Vivía ahí, y `ci.yml` solo se dispara con empujes y
# PR contra la rama principal. Eso deja un agujero que no depende del código:
# **un espacio creado un martes, sin que nadie toque el repo, queda invisible
# para toda la flota hasta que alguien haga un commit.** El guardián existe para
# que un olvido no pase desapercibido, y estaba atado a que hubiera trabajo.
#
# La forma del disparador por reloj ya existía en esta casa —`digest-cron.yml` y
# `db-backup.yml`—; es la misma pieza. Aquí se usa tal cual.
#
# QUÉ QUEDA AQUÍ, Y QUÉ SE FUE (11-ago-2026). Aquí solo queda el RELOJ, que es
# lo único que este fichero puede hacer y `ci.yml` no. Sus caminos de `push` y
# `pull_request` se plegaron dentro de `comprobaciones-baratas`: hacían el mismo
# trabajo de seis segundos pagando un corredor, un arranque y un `checkout`
# propios, y **GitHub factura por job redondeando al minuto**.
#
# Lo que NO cambia: un cambio en el guardián o en su lista de decisiones se sigue
# midiendo ANTES de entrar, no al día siguiente. Se mide en `ci.yml`, con su
# sello delante y su propia línea en el verdicto.

on:
  schedule:
    # 06:41 UTC diario. Minuto impar y separado del backup (03:17) a propósito:
    # dos guardianes que despiertan a la vez comparten cualquier caída del
    # runner, y entonces el silencio de los dos significa lo mismo.
    - cron: '41 6 * * *'
  workflow_dispatch:

# Ya no hay corridas de rama que cancelar —solo reloj y disparo manual—, así que
# `cancel-in-progress` se queda en `false`: aquí no hay corrida obsoleta que
# tirar, hay una tarea que o se hace o no se hace.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rail-scope:
    name: Riel — ¿su alcance es el que debería?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (historial completo para el diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Ya no hay compuerta de relevancia, y es una consecuencia y no un recorte:
      # por aquí solo entran el reloj y el disparo manual, y para los dos la
      # respuesta siempre era «se corre entero». Lo que vigila de verdad es la
      # BASE, y eso hay que mirarlo cada día pase lo que pase en el repo.

      # El sello va ANTES y no toca la DB: si el guardián está destripado, se
      # sabe aquí y no hace falta ni preguntar.
      - name: Sello — ¿muerde en las dos direcciones?
        run: bash scripts/rail-blindspot.test.sh

      # Le pregunta a la DB porque el riel NO puede contestar esto: sus puntos
      # ciegos no salen en su propia lista, por definición. Y su exceso de
      # alcance tampoco: desde dentro, estar de más se ve igual que estar bien.
      # Mismo secret que usa db-backup.yml — `service_role`, que salta RLS.
      - name: Guardián — cruce contra la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/rail-blindspot.sh
