name: CI

# Mitigación D-03 audit Mariana 2026-05-27:
# Hasta ahora no había gate automático en PRs. Este workflow:
#   - Ejecuta jest server tests en cada push/PR
#   - Verifica que el client build funcione
#   - Reporta fallos antes del merge a main
#
# ─────────────────────────────────────────────────────────────────────────────
# POR QUÉ LAS COMPROBACIONES BARATAS VIVEN EN UN SOLO JOB (7-ago-2026)
#
# **GitHub factura por JOB y redondea hacia arriba al minuto entero.** Un job de
# cuatro segundos cuesta lo mismo que uno de cincuenta y nueve: un minuto.
#
# Medido sobre el ciclo completo de una tarjeta real (abrir el PR #40 + mergear):
#
#   corrida de PR   →  4 workflows, 11 jobs, 1,9 min de trabajo real → 11 min facturados
#   corrida de push →  4 workflows, 11 jobs, 1,9 min de trabajo real → 11 min facturados
#   ─────────────────────────────────────────────────────────────────────────
#   ciclo completo  →  3,8 min de cómputo real  →  **22 min facturados**
#
# **El 83 % de la factura era redondeo, no cómputo.** Y los ocho jobs de este
# fichero tardaban entre 4 y 35 segundos cada uno: no había nada que optimizar
# dentro de ellos. `setup-node` con `cache: npm` ya estaba puesto donde hacía
# falta. La única palanca que mueve el número es **cuántos jobs hay**.
#
# LA OBJECIÓN, Y CÓMO SE RESPONDE. Fundir jobs los serializa y puede hacer que
# «un guardián en rojo no se distinga de otro». Lo primero es cierto y cuesta
# ~40 s en total (la suma medida de los cinco). Lo segundo **no ocurre aquí**:
# cada comprobación es un `step` con su nombre, **ninguna corta la ejecución de
# las siguientes** (`continue-on-error` + verdicto final), y el último paso
# imprime la tabla de quién pasó y quién no antes de poner el job en rojo.
#
# Lo que NO se toca, y es deliberado:
#   · **La corrida de `push` a `main` sigue entera.** Es el registro de que el
#     commit desplegado pasó sus comprobaciones, y `main` no está protegida.
#   · **`cancel-in-progress` sigue solo en `pull_request`.** Cancelar la de
#     `main` borraría ese registro.
#   · **Ningún disparador filtra por rutas.** Se pagó el 6-ago con el #34: una
#     comprobación ausente no se distingue de una que pasó.
#   · **`server-tests` y `client-build` siguen sueltos.** Son los únicos que
#     hacen trabajo de verdad y los únicos que crecerán.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela runs anteriores si llega un nuevo push al mismo branch
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # Solo en pull_request: en `main` la corrida ES el registro de que lo que
  # hay puesto pasó sus comprobaciones, y cancelarla lo borra.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-tests:
    name: Server tests (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        # Env vars stub para evitar fallos en module-load (resend, jwt, etc).
        # NO son secrets reales — solo placeholders para que require() no explote.
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          RESEND_API_KEY: test_key
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: test_service_role
          SUPABASE_ANON_KEY: test_anon_key
        run: |
          # Sin --testTimeout: el presupuesto lo custodia package.json y aquí no
          # se repite. Estuvieron desalineados —10000 en package.json, 15000
          # aquí— así que `npm test` y CI juzgaban con reglas distintas.
          npx jest server/tests \
            --runInBand \
            --no-watchman \
            --forceExit \
            --ci

      # Un verde de arriba dice que las pruebas pasan, NO que midan el código:
      # los dobles de `supabaseAdmin` de la puerta interna llegaron a devolver
      # sus fixtures pasara lo que pasara, y siete defectos reales pasaron en
      # verde por eso. Esto destripa la ruta siete veces y exige rojo en cada
      # una. Vive AQUÍ dentro y no en un job propio a propósito: GitHub factura
      # por job redondeando al minuto, y esto son ~10 s dentro de un job que ya
      # existe y ya tiene `npm ci` hecho.
      - name: Mutación — ¿los dobles de la puerta interna ejercen el código?
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          RESEND_API_KEY: test_key
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: test_service_role
          SUPABASE_ANON_KEY: test_anon_key
        run: bash scripts/puerta-interna.mutation.sh

  comprobaciones-baratas:
    # Antes eran CINCO jobs sueltos —rail-validation, contract-guard,
    # grants-guard, hook-guard, email-guard— de 4 a 8 segundos cada uno. Cinco
    # corredores, cinco arranques, cinco `checkout`, y cinco minutos facturados
    # por menos de cuarenta segundos de trabajo.
    #
    # Cada comprobación conserva su nombre, su orden sello→guardián, y su
    # capacidad de ponerse roja por su cuenta sin tapar a las demás.
    name: Comprobaciones baratas (guardianes + validación del riel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `fetch-depth: 0` porque contract-guard necesita el diff contra la base
      # del PR, no el árbol. Es el requisito más exigente de los cinco y manda
      # sobre el checkout compartido.
      #
      # OJO: que email-guard no mire la historia es una propiedad del SCRIPT
      # —usa `git ls-files` sobre el árbol—, no del calado del checkout. Traer
      # la historia no le cambia lo que mira.
      - name: Checkout (historial completo para el diff de contract-guard)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qué ficheros trae este cambio
        id: diff
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Primer push a un branch nuevo: BASE all-zeros → comparar con árbol vacío
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          CAMBIADOS="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Ficheros cambiados:"; echo "$CAMBIADOS"; echo "---"

          # Va por `GITHUB_ENV` y NO por `GITHUB_OUTPUT` a propósito. Un
          # `${{ steps.x.outputs.y }}` se interpola DENTRO del script de shell,
          # y esta lista es multilínea: un nombre de fichero con comilla, `$` o
          # backtick se ejecutaría. Por el entorno llega como dato y nadie lo
          # vuelve a interpretar.
          {
            echo "CONTRACT_GUARD_CHANGED<<FIN_DIFF"
            echo "$CAMBIADOS"
            echo "FIN_DIFF"
          } >> "$GITHUB_ENV"

          # Y la misma lista CON SU ESTADO. No es un lujo: `docs-guard` mira si
          # hay borrados o renombrados —su regla LINKS comprueba que los enlaces
          # sigan apuntando a algo que existe— y `rail-blindspot` también decide
          # con el estado. Con `--name-only` esa información no está.
          CON_ESTADO="$(git diff --name-status "$BASE" "$HEAD")"
          {
            echo "CAMBIOS_CON_ESTADO<<FIN_DIFF"
            echo "$CON_ESTADO"
            echo "FIN_DIFF"
          } >> "$GITHUB_ENV"

          # `changelog-guard` necesita SABER SI SE BORRÓ un fragmento, no solo
          # qué ficheros cambiaron: ese borrado es lo único que distingue una
          # fusión legítima —que sí escribe el registro— de escribirlo a mano.
          # Por eso `--name-status` y no `--name-only`.
          {
            echo "CHANGELOG_GUARD_CAMBIADOS<<FIN_DIFF"
            git diff --name-status "$BASE" "$HEAD"
            echo "FIN_DIFF"
          } >> "$GITHUB_ENV"

          # Y los mensajes, porque la salida deliberada —`[registro-a-mano]`—
          # vive ahí: queda en el historial y cuesta un acto explícito.
          # El `||` cubre la rama nueva, donde BASE es el árbol vacío y no hay
          # rango que recorrer.
          {
            echo "CHANGELOG_GUARD_MOTIVO<<FIN_DIFF"
            git log --format=%B "$BASE".."$HEAD" 2>/dev/null || git log --format=%B -n 20 "$HEAD"
            echo "FIN_DIFF"
          } >> "$GITHUB_ENV"

      # ── Validación del riel ────────────────────────────────────────────────
      # Sin `pip install`: kanban-mcp/validation.py no importa nada de terceros
      # a propósito, para que esta comprobación corra con un python3 pelado.
      - name: Riel — tests de validación de destino
        id: riel_validacion
        continue-on-error: true
        working-directory: ./kanban-mcp
        run: python3 test_validation.py

      # El ENVOLTORIO. Ahí viven los fallos que este repo ha pagado —el acuse
      # sin resolver, la prioridad corregida en silencio, el responsable que se
      # resolvía después de crear la tarjeta—. Sigue SIN `pip install`: el banco
      # sustituye `httpx` y `mcp` por dobles antes de importar.
      - name: Riel — tests del envoltorio
        id: riel_envoltorio
        continue-on-error: true
        working-directory: ./kanban-mcp
        run: python3 test_server.py

      # ── contract-guard ─────────────────────────────────────────────────────
      # El sello va ANTES: si el guardián está destripado, se sabe aquí y da
      # igual lo que conteste luego.
      - name: Sello — ¿contract-guard muerde con una puerta tocada sin contrato?
        id: sello_contract
        continue-on-error: true
        run: bash scripts/contract-guard.test.sh

      # `CONTRACT_GUARD_CHANGED` ya viene del entorno, puesto por el paso del
      # diff. No se interpola aquí: ver el comentario de aquel paso.
      - name: Guardián — ¿cambió una puerta sin tocar su contrato?
        id: contract
        continue-on-error: true
        run: bash scripts/contract-guard.sh

      # ── grants-guard ───────────────────────────────────────────────────────
      # Su sello no toca la DB: si el guardián está destripado se sabe sin
      # gastar una consulta. Cubre la DECISIÓN sobre las filas, no la consulta.
      - name: Sello — ¿grants-guard muerde con una tabla abierta?
        id: sello_grants
        continue-on-error: true
        run: bash scripts/grants-guard.test.sh

      # Le pregunta a la base porque el esquema documentado NO puede contestar
      # esto: describe lo que se concedió a mano, y el defecto es justamente lo
      # que se concede solo. Mismo secret que usa db-backup.yml.
      - name: Guardián — ¿alguna tabla se abrió al rol anónimo?
        id: grants
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/grants-guard.sh

      # ── hook-guard ─────────────────────────────────────────────────────────
      - name: Sello — ¿hook-guard muerde con el enganche quitado?
        id: sello_hook
        continue-on-error: true
        run: bash scripts/hook-guard.test.sh

      - name: Guardián — ¿sigue declarado el enganche de permisos?
        id: hook
        continue-on-error: true
        run: bash scripts/hook-guard.sh

      # ── email-guard ────────────────────────────────────────────────────────
      - name: Sello — ¿email-guard muerde con una dirección personal y calla con una de ejemplo?
        id: sello_email
        continue-on-error: true
        run: bash scripts/email-guard.test.sh

      - name: Guardián — ¿entró una dirección de correo sin declarar?
        id: email
        continue-on-error: true
        run: bash scripts/email-guard.sh

      # ── el verdicto ────────────────────────────────────────────────────────
      # ESTE PASO ES LA RESPUESTA A «fundir jobs hace que un rojo no se
      # distinga de otro». Todas corrieron; aquí se dice cuál falló y por su
      # nombre, y solo entonces el job se pone rojo.
      #
      # Sin él, `continue-on-error` dejaría el job en verde con guardianes en
      # rojo dentro: exactamente el fallo que el #34 pagó, con otra cara.
      # ── el cableado ────────────────────────────────────────────────────────
      # El verdicto juzga LO QUE SE LE PASA. Esto comprueba que se le pase todo
      # lo que hay que juzgar: que el conjunto de `id` con `continue-on-error`
      # de arriba y el de `steps.<id>.outcome` de abajo sean el MISMO.
      #
      # Sin él, borrar una línea de la llamada deja ese guardián en rojo dentro
      # de un job en verde, para siempre y sin rastro. Antes de fundir los jobs
      # eso se veía —la comprobación se caía de la lista de checks— y así se cazó
      # el #34. Esto devuelve esa garantía.
      # ── ¿Sigue siendo cierto lo que enseña a preguntarle a la base? ────────
      # No toca la base: compara el ÁRBOL de workflows con lo que el documento
      # nombra. Por eso vive aquí, entre las baratas, y no en un job con
      # credencial.
      - name: Sello — ¿base-consultable-guard muerde en las dos direcciones?
        id: sello_base_consultable
        continue-on-error: true
        run: bash scripts/base-consultable-guard.test.sh

      - name: Guardián — ¿el documento nombra las vías que de verdad contestan?
        id: base_consultable
        continue-on-error: true
        run: bash scripts/base-consultable-guard.sh

      # ── ¿El registro por fragmentos se puede publicar sin perder nada? ─────
      # No escribe: funde en seco. Vive aquí, entre las baratas, porque no toca
      # la base ni la red.
      - name: Sello — ¿changelog-guard muerde el fragmento roto y la fusión rota?
        id: sello_changelog
        continue-on-error: true
        run: bash scripts/changelog-guard.test.sh

      - name: Guardián — ¿el registro se funde sin perder ni duplicar?
        id: changelog
        continue-on-error: true
        run: bash scripts/changelog-guard.sh

      # ── docs-guard · schema-guard · alcance del riel ───────────────────────
      # Estos tres eran WORKFLOWS SUELTOS y pagaban su propio minuto cada uno:
      # 382 minutos facturados en once días por unos 24 segundos de trabajo por
      # evento. Es exactamente lo que este job dejó de hacer con los otros cinco.
      #
      # ⚠️ LA COMPUERTA DE RELEVANCIA BAJA DEL YAML AL PASO, Y NO ES ESTILO.
      # Allí era un `if:` que dejaba el paso en `skipped`, y aquí `skipped` es
      # ROJO a propósito — el guardián del verdicto lo declara en su cabecera:
      # «una comprobación que se salta sola es indistinguible de una que pasó».
      #
      # (Su nombre de fichero NO se escribe aquí, y no es despiste: el guardián
      # del cableado busca esa cadena por subcadena para localizar el paso del
      # verdicto, y no ignora los comentarios. Nombrarlo en uno hacía que
      # tomara ESTE paso por el verdicto y diera «nadie juzga nada» sobre los 25.
      # Medido al escribir esto.)
      #
      # Si trajera el
      # `if:` tal cual, cada corrida irrelevante pondría el job en rojo; y si el
      # verdicto aprendiera a tolerar `skipped`, perdería la única garantía que
      # tiene. Así que el paso corre SIEMPRE y decide dentro: quien no tiene nada
      # que mirar lo dice y sale en verde, y eso queda escrito en su log.
      #
      # Los SELLOS no llevan compuerta: cuestan menos de un segundo (salvo el de
      # docs, cinco) y un guardián destripado no puede depender de que ese día
      # hubiera algo que mirar.

      - name: Sello — ¿docs-guard muerde en cada forma que dice vigilar?
        id: sello_docs
        continue-on-error: true
        run: bash scripts/docs-guard.test.sh

      # La ÚNICA con compuerta, y por su coste medido: 23 s, porque corre el
      # sello entero ocho veces. Solo dice algo cuando el guardián o su sello
      # cambian — y eso es justo lo que `--relevante` considera relevante.
      - name: Mutación — ¿el sello nota si se destripa una regla de docs-guard?
        id: mutacion_docs
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(DOCS_GUARD_CAMBIADOS="$CAMBIOS_CON_ESTADO" bash scripts/docs-guard.sh --relevante)" != "SI" ]; then
            echo "Nada que mirar en este cambio: no se toca lo que docs-guard lee ni el propio guardián."
            exit 0
          fi
          bash scripts/docs-guard.mutation.sh

      - name: Guardián — ¿hay estado copiado en README.md / CLAUDE.md?
        id: docs
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(DOCS_GUARD_CAMBIADOS="$CAMBIOS_CON_ESTADO" bash scripts/docs-guard.sh --relevante)" != "SI" ]; then
            echo "Nada que mirar en este cambio."
            exit 0
          fi
          DOCS_GUARD_CAMBIADOS="$CAMBIOS_CON_ESTADO" bash scripts/docs-guard.sh

      - name: Sello — ¿schema-guard distingue estructura de datos y exige GRANT/RLS?
        id: sello_schema
        continue-on-error: true
        run: bash scripts/schema-guard.test.sh

      - name: Guardián — ¿una migración entra sin actualizar el esquema?
        id: schema
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(SCHEMA_GUARD_CAMBIADOS="$CONTRACT_GUARD_CHANGED" bash scripts/schema-guard.sh --relevante)" != "SI" ]; then
            echo "Nada que mirar en este cambio: ninguna migración ni el esquema."
            exit 0
          fi
          SCHEMA_GUARD_CHANGED="$CONTRACT_GUARD_CHANGED" bash scripts/schema-guard.sh

      - name: Sello — ¿rail-blindspot muerde en las dos direcciones?
        id: sello_rail
        continue-on-error: true
        run: bash scripts/rail-blindspot.test.sh

      # ⛔ SU RELOJ NO SE TOCA. `rail-scope.yml` sigue existiendo con su `cron`
      # diario, y es lo único que queda ahí: un espacio creado un martes, sin que
      # nadie toque el repo, queda invisible para toda la flota hasta el siguiente
      # commit. Lo que se pliega aquí es su camino de `push`/`pull_request`.
      - name: Guardián — ¿el alcance del riel es el que debería?
        id: rail
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ "$(RAIL_SCOPE_CAMBIADOS="$CAMBIOS_CON_ESTADO" bash scripts/rail-blindspot.sh --relevante)" != "SI" ]; then
            echo "Nada que mirar en este cambio: ni el guardián ni su lista de excepciones."
            exit 0
          fi
          bash scripts/rail-blindspot.sh

      # ── ¿alguna tubería puede mentir cuando crezca lo que le pasas? ────────
      # No toca la base ni la red: lee ficheros del árbol. Por eso vive aquí,
      # entre las baratas.
      #
      # Existe porque este patrón dejó a la nave CUATRO DÍAS SIN COPIA de
      # seguridad, y porque lo peor no es el fallo: es que aparece solo cuando
      # crece lo que entra, sin que nadie toque una línea.
      - name: Sello — ¿pipefail-guard muerde el patrón y calla ante la forma buena?
        id: sello_pipefail
        continue-on-error: true
        run: bash scripts/pipefail-guard.test.sh

      - name: Guardián — ¿hay tuberías hacia un lector que sale antes de tiempo?
        id: pipefail
        continue-on-error: true
        run: bash scripts/pipefail-guard.sh

      # ── ¿«ninguna fallida» o «ninguna»? ────────────────────────────────────
      # Solo el SELLO vive aquí. Su guardián NO puede: existe para cazar PR sin
      # corridas, y dentro del CI de un PR sin corridas tampoco correría él.
      # Vive en `.github/workflows/pr-corridas.yml`, por reloj y a mano.
      #
      # El sello sí cabe, no toca la red y cuesta menos de un segundo — y así un
      # guardián destripado se sabe en el PR que lo destripa, no al día siguiente.
      - name: Sello — ¿corridas-guard distingue «ninguna fallida» de «ninguna»?
        id: sello_corridas
        continue-on-error: true
        run: bash scripts/corridas-guard.test.sh

      # ── ¿el reloj del digest y las horas admisibles dicen lo mismo? ───────
      # No toca la base ni la red: compara el `cron` del workflow con la lista
      # canónica del servidor. Existe porque el YAML no puede importar el fichero
      # JS, así que «la misma lista» no se sostiene sola.
      - name: Sello — ¿digest-horas-guard muerde en las dos direcciones?
        id: sello_digest_horas
        continue-on-error: true
        run: bash scripts/digest-horas-guard.test.sh

      - name: Guardián — ¿el reloj del digest visita las horas que el servidor admite?
        id: digest_horas
        continue-on-error: true
        run: bash scripts/digest-horas-guard.sh

      - name: Sello — ¿el guardián del cableado muerde en las dos direcciones?
        id: sello_cableado
        continue-on-error: true
        run: bash scripts/ci-cableado.test.sh

      - name: Guardián — ¿el verdicto juzga TODOS los pasos que pueden fallar?
        id: cableado
        continue-on-error: true
        run: bash scripts/ci-cableado.sh

      # El sello del verdicto va ANTES que el verdicto, como el de cualquier
      # guardián de esta casa: si el que decide el color está destripado, da
      # igual lo que conteste sobre los resultados de arriba.
      #
      # Éste sí corre en seco, sin `continue-on-error`: es el único que no puede
      # delegar su propio fallo en el que está comprobando.
      - name: Sello — ¿el verdicto pone rojo un resultado vacío o saltado?
        run: bash scripts/ci-verdicto.test.sh

      - name: Verdicto — ¿pasó alguna en rojo?
        run: |
          bash scripts/ci-verdicto.sh \
            "Riel · validación de destino|${{ steps.riel_validacion.outcome }}" \
            "Riel · envoltorio|${{ steps.riel_envoltorio.outcome }}" \
            "contract-guard · sello|${{ steps.sello_contract.outcome }}" \
            "contract-guard · guardián|${{ steps.contract.outcome }}" \
            "grants-guard · sello|${{ steps.sello_grants.outcome }}" \
            "grants-guard · guardián|${{ steps.grants.outcome }}" \
            "hook-guard · sello|${{ steps.sello_hook.outcome }}" \
            "hook-guard · guardián|${{ steps.hook.outcome }}" \
            "email-guard · sello|${{ steps.sello_email.outcome }}" \
            "email-guard · guardián|${{ steps.email.outcome }}" \
            "base-consultable · sello|${{ steps.sello_base_consultable.outcome }}" \
            "base-consultable · guardián|${{ steps.base_consultable.outcome }}" \
            "changelog · sello|${{ steps.sello_changelog.outcome }}" \
            "changelog · guardián|${{ steps.changelog.outcome }}" \
            "docs-guard · sello|${{ steps.sello_docs.outcome }}" \
            "docs-guard · mutación|${{ steps.mutacion_docs.outcome }}" \
            "docs-guard · guardián|${{ steps.docs.outcome }}" \
            "schema-guard · sello|${{ steps.sello_schema.outcome }}" \
            "schema-guard · guardián|${{ steps.schema.outcome }}" \
            "alcance del riel · sello|${{ steps.sello_rail.outcome }}" \
            "alcance del riel · guardián|${{ steps.rail.outcome }}" \
            "tuberías que mienten · sello|${{ steps.sello_pipefail.outcome }}" \
            "tuberías que mienten · guardián|${{ steps.pipefail.outcome }}" \
            "corridas que faltan · sello|${{ steps.sello_corridas.outcome }}" \
            "horas del digest · sello|${{ steps.sello_digest_horas.outcome }}" \
            "horas del digest · guardián|${{ steps.digest_horas.outcome }}" \
            "cableado del verdicto · sello|${{ steps.sello_cableado.outcome }}" \
            "cableado del verdicto · guardián|${{ steps.cableado.outcome }}"

  client-build:
    name: Client build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build (incluye prebuild legal → privacidad.html via marked)
        working-directory: ./client
        run: npm run build

      - name: Verify dist
        working-directory: ./client
        run: |
          test -f dist/index.html
          test -f dist/privacidad.html
          test -d dist/assets
          ls -lh dist/

