name: CI

# Mitigación D-03 audit Mariana 2026-05-27:
# Hasta ahora no había gate automático en PRs. Este workflow:
#   - Ejecuta jest server tests en cada push/PR
#   - Verifica que el client build funcione
#   - Reporta fallos antes del merge a main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela runs anteriores si llega un nuevo push al mismo branch
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  # Solo en pull_request: en `main` la corrida ES el registro de que lo que
  # hay puesto pasó sus comprobaciones, y cancelarla lo borra.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server-tests:
    name: Server tests (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        # Env vars stub para evitar fallos en module-load (resend, jwt, etc).
        # NO son secrets reales — solo placeholders para que require() no explote.
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          RESEND_API_KEY: test_key
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: test_service_role
          SUPABASE_ANON_KEY: test_anon_key
        run: |
          # Sin --testTimeout: el presupuesto lo custodia package.json y aquí no
          # se repite. Estuvieron desalineados —10000 en package.json, 15000
          # aquí— así que `npm test` y CI juzgaban con reglas distintas.
          npx jest server/tests \
            --runInBand \
            --no-watchman \
            --forceExit \
            --ci

  rail-validation:
    name: Riel — validación de destino (python, stdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sin `pip install`: kanban-mcp/validation.py no importa nada de terceros
      # a propósito, para que esta comprobación corra con un python3 pelado.
      # Cubre que create_card exige el espacio de destino Y lo valida contra la
      # columna — exigirlo sin comprobarlo daría sensación de control sin control.
      - name: Tests de validación del riel
        working-directory: ./kanban-mcp
        run: python3 test_validation.py

      # El ENVOLTORIO, que hasta hoy no corría en CI: se verificaba a mano contra
      # la base. Ahí viven los fallos que este repo ha pagado —el acuse sin
      # resolver, la prioridad corregida en silencio, el responsable que se
      # resolvía después de crear la tarjeta—, así que quedaba la capa más cara
      # sin red debajo.
      #
      # Sigue SIN `pip install`, que era la razón por la que no existía: el banco
      # sustituye `httpx` y `mcp` por dobles antes de importar. La regla del
      # trabajo anterior no se afloja para que quepa el nuevo.
      - name: Tests del envoltorio del riel
        working-directory: ./kanban-mcp
        run: python3 test_server.py

  contract-guard:
    name: ¿Cambió una puerta sin tocar su contrato?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Historial completo: hace falta el diff contra la base del PR, no el
      # árbol. Mismo motivo que schema-guard.
      - name: Checkout (historial completo para diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # El sello va ANTES y no necesita el diff: si el guardián está destripado,
      # se sabe aquí y da igual lo que conteste luego. Mismo orden que
      # docs-guard y rail-blindspot.
      - name: Sello — ¿muerde con una puerta tocada sin contrato?
        run: bash scripts/contract-guard.test.sh

      - name: Guardián — sobre los ficheros de este cambio
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Primer push a un branch nuevo: BASE all-zeros → comparar con árbol vacío
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          CAMBIADOS="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Ficheros cambiados:"; echo "$CAMBIADOS"; echo "---"

          CONTRACT_GUARD_CHANGED="$CAMBIADOS" bash scripts/contract-guard.sh

  grants-guard:
    name: ¿Alguna tabla se abrió al rol anónimo?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El sello va ANTES y no toca la DB: si el guardián está destripado se sabe
      # aquí, sin gastar una consulta. Mismo orden que docs-guard y rail-blindspot.
      #
      # Ojo con lo que ese sello cubre: la DECISIÓN sobre las filas, no la
      # consulta. Está escrito en su cabecera y comprobado por mutación.
      - name: Sello — ¿muerde con una tabla abierta?
        run: bash scripts/grants-guard.test.sh

      # Le pregunta a la base porque el esquema documentado NO puede contestar
      # esto: describe lo que se concedió a mano, y el defecto es justamente lo
      # que se concede solo. Mismo secret que usa db-backup.yml.
      - name: Guardián — cruce contra la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/grants-guard.sh

  # El guardián del alcance del riel ya NO vive aquí: pasó a
  # `.github/workflows/rail-scope.yml`, que además corre POR RELOJ. Este
  # workflow solo se dispara con empujes y PR, y eso dejaba un espacio creado
  # sin tocar el repo invisible para toda la flota hasta el siguiente commit.

  hook-guard:
    name: ¿Sigue declarado el enganche de permisos?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El sello va ANTES, como en los demás: si el guardián está destripado se
      # sabe aquí. Mismo orden que docs-guard, contract-guard y grants-guard.
      - name: Sello — ¿muerde con el enganche quitado?
        run: bash scripts/hook-guard.test.sh

      # Sobre el fichero real. Barato y sin secretos: solo lee JSON.
      - name: Guardián — sobre .claude/settings.json
        run: bash scripts/hook-guard.sh

  email-guard:
    name: ¿Entró una dirección de correo sin declarar?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Sin `fetch-depth: 0` A PROPÓSITO: este guardián mira el ÁRBOL de hoy, no
      # el diff ni la historia. Un checkout somero ya trae el índice completo, que
      # es lo que `git ls-files` necesita. Que no mire la historia está declarado
      # en la cabecera del script, y es la limitación que más importa de todas.
      - name: Checkout
        uses: actions/checkout@v4

      # El sello va ANTES, como en los demás guardianes de esta casa: si el
      # guardián está destripado se sabe aquí, y da igual lo que conteste luego
      # sobre el árbol real. Mismo orden que docs-guard, contract-guard,
      # grants-guard y hook-guard.
      - name: Sello — ¿muerde con una dirección personal y calla con una de ejemplo?
        run: bash scripts/email-guard.test.sh

      # Sobre el árbol real. Barato y sin secretos: solo lee ficheros.
      - name: Guardián — sobre el árbol versionado
        run: bash scripts/email-guard.sh

  client-build:
    name: Client build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build (incluye prebuild legal → privacidad.html via marked)
        working-directory: ./client
        run: npm run build

      - name: Verify dist
        working-directory: ./client
        run: |
          test -f dist/index.html
          test -f dist/privacidad.html
          test -d dist/assets
          ls -lh dist/

  npm-audit:
    name: npm audit (informativo, no falla CI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Server audit
        run: npm audit --audit-level=high || echo "::warning::npm audit reportó vulns HIGH+ en server deps"

      - name: Client audit
        working-directory: ./client
        run: npm audit --audit-level=high || echo "::warning::npm audit reportó vulns HIGH+ en client deps"
