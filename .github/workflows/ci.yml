name: CI

# Mitigación D-03 audit Mariana 2026-05-27:
# Hasta ahora no había gate automático en PRs. Este workflow:
#   - Ejecuta jest server tests en cada push/PR
#   - Verifica que el client build funcione
#   - Reporta fallos antes del merge a main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela runs anteriores si llega un nuevo push al mismo branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server tests (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        # Env vars stub para evitar fallos en module-load (resend, jwt, etc).
        # NO son secrets reales — solo placeholders para que require() no explote.
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          RESEND_API_KEY: test_key
          SUPABASE_URL: http://localhost
          SUPABASE_SERVICE_ROLE_KEY: test_service_role
          SUPABASE_ANON_KEY: test_anon_key
        run: |
          npx jest server/tests \
            --runInBand \
            --no-watchman \
            --forceExit \
            --testTimeout=15000 \
            --ci

  rail-validation:
    name: Riel — validación de destino (python, stdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sin `pip install`: kanban-mcp/validation.py no importa nada de terceros
      # a propósito, para que esta comprobación corra con un python3 pelado.
      # Cubre que create_card exige el espacio de destino Y lo valida contra la
      # columna — exigirlo sin comprobarlo daría sensación de control sin control.
      - name: Tests de validación del riel
        working-directory: ./kanban-mcp
        run: python3 test_validation.py

  contract-guard:
    name: ¿Cambió una puerta sin tocar su contrato?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Historial completo: hace falta el diff contra la base del PR, no el
      # árbol. Mismo motivo que schema-guard.
      - name: Checkout (historial completo para diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # El sello va ANTES y no necesita el diff: si el guardián está destripado,
      # se sabe aquí y da igual lo que conteste luego. Mismo orden que
      # docs-guard y rail-blindspot.
      - name: Sello — ¿muerde con una puerta tocada sin contrato?
        run: bash scripts/contract-guard.test.sh

      - name: Guardián — sobre los ficheros de este cambio
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Primer push a un branch nuevo: BASE all-zeros → comparar con árbol vacío
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi

          CAMBIADOS="$(git diff --name-only "$BASE" "$HEAD")"
          echo "Ficheros cambiados:"; echo "$CAMBIADOS"; echo "---"

          CONTRACT_GUARD_CHANGED="$CAMBIADOS" bash scripts/contract-guard.sh

  rail-blindspot:
    name: Riel — ¿hay algún espacio inalcanzable?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # El sello va ANTES y no toca la DB: si el guardián está destripado, se
      # sabe aquí y no hace falta ni preguntar. Mismo orden que docs-guard.
      - name: Sello — ¿muerde con un espacio ciego sin justificar?
        run: bash scripts/rail-blindspot.test.sh

      # Le pregunta a la DB porque el riel NO puede contestar esto: sus puntos
      # ciegos no salen en su propia lista, por definición. Mismo secret que usa
      # db-backup.yml — el alcance de `service_role`, que salta RLS.
      - name: Guardián — cruce contra la base de datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/rail-blindspot.sh

  client-build:
    name: Client build (vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci

      - name: Build (incluye prebuild legal → privacidad.html via marked)
        working-directory: ./client
        run: npm run build

      - name: Verify dist
        working-directory: ./client
        run: |
          test -f dist/index.html
          test -f dist/privacidad.html
          test -d dist/assets
          ls -lh dist/

  npm-audit:
    name: npm audit (informativo, no falla CI)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Server audit
        run: npm audit --audit-level=high || echo "::warning::npm audit reportó vulns HIGH+ en server deps"

      - name: Client audit
        working-directory: ./client
        run: npm audit --audit-level=high || echo "::warning::npm audit reportó vulns HIGH+ en client deps"
